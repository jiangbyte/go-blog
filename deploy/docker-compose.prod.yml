# 线上：拉取 ACR :latest（不在服务器构建）
# 用法：
#   cp .env.example .env   # 填生产配置
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --force-recreate
#
# 本机发版：make docker-push IMAGE_VERSION=1.0.0  （同时推 :1.0.0 与 :latest）
# 需先：docker login your-registry.example.com

name: go-blog

services:
  api:
    image: your-registry.example.com/your-namespace/go-blog-api:latest
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "256mb"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api_data:/app/data
    restart: unless-stopped

  blog:
    image: your-registry.example.com/your-namespace/go-blog-blog:latest
    restart: unless-stopped

  admin:
    image: your-registry.example.com/your-namespace/go-blog-admin:latest
    restart: unless-stopped

  resume:
    image: your-registry.example.com/your-namespace/go-blog-resume:latest
    restart: unless-stopped

  gateway:
    image: your-registry.example.com/your-namespace/go-blog-gateway:latest
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      IMAGE_DOMAIN: ${IMAGE_DOMAIN:-}
      IMAGE_UPSTREAM: ${IMAGE_UPSTREAM:-}
      RESUME_DOMAIN: ${RESUME_DOMAIN:-}
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - gateway_caddy_data:/data
      - gateway_caddy_config:/config
    depends_on:
      - api
      - blog
      - admin
      - resume
    restart: unless-stopped

volumes:
  api_data:
  gateway_caddy_data:
  gateway_caddy_config:
